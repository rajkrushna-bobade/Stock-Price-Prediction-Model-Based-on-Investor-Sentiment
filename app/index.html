<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stock Sentiment LSTM Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #4f8cff;
    --accent2: #ff6b6b;
    --border: #262a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 140px; }
  .stat .label { color: var(--muted); font-size: 0.8rem; }
  .stat .value { font-size: 1.4rem; font-weight: 600; margin-top: 4px; }
  #status { color: var(--muted); }
  canvas { max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">📈 Stock Sentiment LSTM Dashboard</h1>
  <p class="subtitle">Actual vs predicted closing price, with daily investor sentiment overlay.</p>

  <div class="card stats" id="statCards">
    <div class="stat"><div class="label">Ticker</div><div class="value" id="statTicker">—</div></div>
    <div class="stat"><div class="label">RMSE</div><div class="value" id="statRmse">—</div></div>
    <div class="stat"><div class="label">MAE</div><div class="value" id="statMae">—</div></div>
    <div class="stat"><div class="label">Directional Accuracy</div><div class="value" id="statDir">—</div></div>
  </div>

  <div class="card">
    <canvas id="priceChart" height="110"></canvas>
  </div>

  <div class="card">
    <canvas id="sentimentChart" height="80"></canvas>
  </div>

  <p id="status">Loading predictions.json…</p>
</div>

<script>
async function loadData() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch('predictions.json');
    if (!res.ok) throw new Error('predictions.json not found');
    const data = await res.json();

    document.getElementById('statTicker').textContent = data.ticker || '—';

    const n = data.actual.length;
    const rmse = Math.sqrt(data.actual.reduce((s, v, i) => s + (v - data.predicted[i]) ** 2, 0) / n);
    const mae = data.actual.reduce((s, v, i) => s + Math.abs(v - data.predicted[i]), 0) / n;

    document.getElementById('statRmse').textContent = rmse.toFixed(2);
    document.getElementById('statMae').textContent = mae.toFixed(2);

    let correct = 0;
    for (let i = 1; i < n; i++) {
      const trueDir = Math.sign(data.actual[i] - data.actual[i - 1]);
      const predDir = Math.sign(data.predicted[i] - data.predicted[i - 1]);
      if (trueDir === predDir) correct++;
    }
    document.getElementById('statDir').textContent = ((correct / (n - 1)) * 100).toFixed(1) + '%';

    new Chart(document.getElementById('priceChart'), {
      type: 'line',
      data: {
        labels: data.dates,
        datasets: [
          { label: 'Actual Close', data: data.actual, borderColor: '#4f8cff', backgroundColor: 'transparent', tension: 0.2, pointRadius: 0 },
          { label: 'Predicted Close', data: data.predicted, borderColor: '#ff6b6b', backgroundColor: 'transparent', tension: 0.2, pointRadius: 0 },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e8e9ee' } } },
        scales: {
          x: { ticks: { color: '#8b8fa3', maxTicksLimit: 10 }, grid: { color: '#262a38' } },
          y: { ticks: { color: '#8b8fa3' }, grid: { color: '#262a38' } },
        },
      },
    });

    new Chart(document.getElementById('sentimentChart'), {
      type: 'bar',
      data: {
        labels: data.dates,
        datasets: [{ label: 'Daily Sentiment', data: data.sentiment, backgroundColor: '#8b8fa3' }],
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e8e9ee' } } },
        scales: {
          x: { ticks: { color: '#8b8fa3', maxTicksLimit: 10 }, grid: { color: '#262a38' } },
          y: { ticks: { color: '#8b8fa3' }, grid: { color: '#262a38' } },
        },
      },
    });

    statusEl.textContent = `Loaded ${n} predictions.`;
  } catch (err) {
    statusEl.textContent = 'Could not load predictions.json — run src/predict.py first to generate it.';
  }
}
loadData();
</script>
</body>
</html>
